<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration | Solidaria Fund</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f6fb; color: #18304f; }
    header { background: #102e55; color: white; padding: 22px 18px; }
    main { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
    .panel { background: white; padding: 22px; border-radius: 14px; margin-bottom: 18px; box-shadow: 0 5px 20px #18304f12; }
    input, button { width: 100%; padding: 12px; margin: 7px 0; border-radius: 8px; font-size: 16px; }
    input { border: 1px solid #ccd5e0; }
    button { border: 0; background: #1765b4; color: white; font-weight: bold; cursor: pointer; }
    .secondary { background: #52657a; }
    .request { border-top: 1px solid #e1e7ef; padding: 14px 0; overflow-wrap: anywhere; }
    .muted { color: #65758a; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <h2>Solidaria Fund — Administration</h2>
  <p>Gestion des demandes</p>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h2>Connexion administrateur</h2>
    <p class="muted">Connecte-toi avec ton compte Supabase.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Adresse e-mail" required>
      <input id="password" type="password" placeholder="Mot de passe" required>
      <button type="submit">Se connecter</button>
    </form>
  </section>

  <section id="dashboard" class="panel" hidden>
    <h2>Demandes reçues</h2>
    <p id="count"></p>
    <button id="refresh">Actualiser</button>
    <button id="logout" class="secondary">Se déconnecter</button>
    <div id="requests"></div>
  </section>

  <section class="panel">
    <p id="status">Prêt.</p>
    <a href="index.html">← Retour au site</a>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://dhbxjbgwkqhegdmwmjpy.supabase.co";
  const SUPABASE_ANON_KEY = "COLLE_TA_CLE_PUBLIQUE_ICI";

  const status = document.getElementById("status");
  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const requests = document.getElementById("requests");
  const count = document.getElementById("count");

  if (!window.supabase || SUPABASE_ANON_KEY === "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoYnhqYmd3a3FoZWdkbXdtanB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5Nzk0NTUsImV4cCI6MjEwODU1NTQ1NX0.J2jb9mwsp2u-QWWkRBy5ggEJo9W--QTVOsRGr5RgZf4") {
    status.textContent = "Configuration incomplète : ajoute la clé publique Supabase.";
    return;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function showLoggedIn(value) {
    loginPanel.hidden = value;
    dashboard.hidden = !value;
  }

  async function loadRequests() {
    status.textContent = "Chargement des demandes…";
    requests.innerHTML = "";

    const { data, error } = await db
      .from("demandes")
      .select("id, nombre_complet, email, telephone, pays, motif, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent = "Erreur de chargement : " + error.message;
      return;
    }

    count.textContent = data.length + " demande(s)";

    if (!data.length) {
      requests.innerHTML = "<p>Aucune demande trouvée.</p>";
    } else {
      requests.innerHTML = data.map(item => `
        <article class="request">
          <h3>${safe(item.nombre_complet)}</h3>
          <p><strong>Numéro :</strong> ${safe(item.id)}</p>
          <p><strong>E-mail :</strong> ${safe(item.email)}</p>
          <p><strong>Téléphone :</strong> ${safe(item.telephone)}</p>
          <p><strong>Pays :</strong> ${safe(item.pays)}</p>
          <p><strong>Motif :</strong> ${safe(item.motif)}</p>
          <p class="muted">${safe(item.created_at ? new Date(item.created_at).toLocaleString("fr-FR") : "")}</p>
        </article>
      `).join("");
    }

    status.textContent = "Demandes actualisées.";
  }

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "Connexion en cours…";

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      status.textContent = "Connexion impossible : " + error.message;
      return;
    }

    showLoggedIn(true);
    await loadRequests();
  });

  document.getElementById("refresh").addEventListener("click", loadRequests);

  document.getElementById("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    showLoggedIn(false);
    requests.innerHTML = "";
    status.textContent = "Déconnecté.";
  });

  db.auth.getSession().then(async ({ data, error }) => {
    if (error) {
      status.textContent = "Erreur de session : " + error.message;
      return;
    }
    showLoggedIn(Boolean(data.session));
    if (data.session) await loadRequests();
  });
})();
</script>
</body>
</html>

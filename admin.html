<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration | Solidaria Fund</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f6fb; color: #18304f; }
    header { background: #102e55; color: white; padding: 22px 18px; }
    header .top, main { max-width: 1000px; margin: auto; }
    header .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header a { color: white; }
    main { padding: 24px 16px; }
    .panel { background: white; padding: 22px; border-radius: 14px; margin-bottom: 18px; box-shadow: 0 5px 20px #18304f12; }
    input, button { width: 100%; padding: 12px; margin: 7px 0; border-radius: 8px; font-size: 16px; }
    input { border: 1px solid #ccd5e0; }
    button { border: 0; background: #1765b4; color: white; font-weight: bold; cursor: pointer; }
    button.secondary { background: #52657a; }
    .request { border-top: 1px solid #e1e7ef; padding: 15px 0; overflow-wrap: anywhere; }
    .muted { color: #65758a; line-height: 1.5; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h2>Solidaria Fund</h2>
      <p>Espace d’administration</p>
    </div>
    <a href="index.html">← Retour au site</a>
  </div>
</header>

<main>
  <section id="loginPanel" class="panel">
    <h1>Connexion administrateur</h1>
    <p class="muted">Utilise ton compte Supabase Auth.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Adresse e-mail" required autocomplete="username">
      <input id="password" type="password" placeholder="Mot de passe" required autocomplete="current-password">
      <button type="submit">Se connecter</button>
    </form>
  </section>

  <section id="dashboard" class="panel" hidden>
    <h1>Demandes reçues</h1>
    <p id="count" class="muted"></p>
    <button id="refresh">Actualiser les demandes</button>
    <button id="logout" class="secondary">Se déconnecter</button>
    <div id="requests"></div>
  </section>

  <section class="panel">
    <p id="status" role="status">Prêt.</p>
  </section>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://dhbxjbgwkqhegdmwmjpy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoYnhqYmd3a3FoZWdkbXdtanB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5Nzk0NTUsImV4cCI6MjEwODU1NTQ1NX0.J2jb9mwsp2u-QWWkRBy5ggEJo9W--QTVOsRGr5RgZf4";

  const status = document.getElementById("status");
  const loginPanel = document.getElementById("loginPanel");
  const dashboard = document.getElementById("dashboard");
  const requests = document.getElementById("requests");
  const count = document.getElementById("count");

  if (!window.supabase) {
    status.textContent = "Erreur : la bibliothèque Supabase n'a pas pu être chargée. Recharge la page.";
    return;
  }

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function safe(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);
  }

  function showLoggedIn(isLoggedIn) {
    loginPanel.hidden = isLoggedIn;
    dashboard.hidden = !isLoggedIn;
  }

  async function loadRequests() {
    status.textContent = "Chargement des demandes…";
    requests.innerHTML = "";

    const { data, error } = await db
      .from("demandes")
      .select("id, nombre_complet, email, telephone, pays, motif, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent =
        "Impossible de charger les demandes. Vérifie la politique SELECT dans Supabase. Détail : " +
        error.message;
      return;
    }

    count.textContent = data.length + " demande(s)";

    if (data.length === 0) {
      requests.innerHTML = "<p>Aucune demande trouvée.</p>";
    } else {
      requests.innerHTML = data.map(item => `
        <article class="request">
          <h3>${safe(item.nombre_complet || "Nom non renseigné")}</h3>
          <p><strong>Numéro :</strong> ${safe(item.id)}</p>
          <p><strong>E-mail :</strong> ${safe(item.email)}</p>
          <p><strong>Téléphone :</strong> ${safe(item.telephone)}</p>
          <p><strong>Pays :</strong> ${safe(item.pays)}</p>
          <p><strong>Motif :</strong> ${safe(item.motif)}</p>
          <p class="muted"><strong>Date :</strong> ${
            safe(item.created_at
              ? new Date(item.created_at).toLocaleString("fr-FR")
              : "Inconnue")
          }</p>
        </article>
      `).join("");
    }

    status.textContent = "Demandes actualisées.";
  }

  document.getElementById("loginForm").addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "Connexion en cours…";

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) {
      status.textContent = "Connexion impossible : " + error.message;
      return;
    }

    showLoggedIn(true);
    await loadRequests();
  });

  document.getElementById("refresh").addEventListener("click", loadRequests);

  document.getElementById("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    showLoggedIn(false);
    requests.innerHTML = "";
    status.textContent = "Déconnecté.";
  });

  db.auth.getSession().then(async ({ data, error }) => {
    if (error) {
      status.textContent = "Erreur de session : " + error.message;
      return;
    }

    showLoggedIn(Boolean(data.session));
    if (data.session) await loadRequests();
  });
})();
</script>
</body>
</html>

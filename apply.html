<script>
document.getElementById("supportForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const feedback = document.getElementById("feedback");
  const button = this.querySelector('button[type="submit"]');

  feedback.textContent = "Enviando tu solicitud...";
  button.disabled = true;

  const datos = {
    nombre_complet: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    telephone: document.getElementById("phone").value.trim(),
    pays: document.getElementById("country").value.trim(),
    motif: document.getElementById("type").value + ": " +
           document.getElementById("details").value.trim()
  };

  try {
    const respuesta = await fetch(
      "https://dhbxjbgwkqhegdmwmjpy.supabase.co/rest/v1/demandes",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": "sb_publishable_4kZy4-3B9tIJOfpcKX_XxQ_tzL6VCTL",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(datos)
      }
    );

    if (!respuesta.ok) {
      throw new Error("Error al guardar la solicitud.");
    }

    feedback.textContent = "¡Solicitud enviada correctamente!";
    feedback.style.color = "#206e54";
    this.reset();

  } catch (error) {
    feedback.textContent =
      "No se pudo enviar. Inténtalo de nuevo más tarde.";
    feedback.style.color = "#b42318";
  } finally {
    button.disabled = false;
  }
});
</script>
